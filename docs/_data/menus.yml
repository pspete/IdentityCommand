# One entry per module, keyed by the `menubar` front matter value.
#
#   label        display name
#   repo         GitHub repository; modules other than `repository` in _config.yml
#                have their docs/ folder copied into /<key>/ by _tools/sync_modules.rb
#   commands     collection holding the module's command help, listed in the sidebar
#   prefix       command noun prefix, omitted from command index headings
#   pinned       commands listed first in the sidebar, e.g. those that start a session
#   description  summary shown on the landing page
#   image        logo shown on the landing page
#   menu         sidebar menu (bulma-clean-theme menubar format)

IdentityCommand:
  label: IdentityCommand
  repo: pspete/IdentityCommand
  commands: commands
  prefix: ID
  pinned:
    - New-IDSession
    - New-IDPlatformToken
  description: >-
    Authentication (MFA, SAML, OIDC, service users) and administration of the Identity tenant:
    users, roles, applications, organizations, policies, SCIM and more.
    The foundation every sibling module builds on.
  image: /media/images/IdentityCommand.png
  menu:
    - label: IdentityCommand
      items:
        - name: Overview
          link: /
        - name: Getting Started
          link: /getting-started/
        - name: Authentication
          link: /authentication/
        - name: Commands
          link: /commands/

SCA:
  label: IdentityCommand.SCA
  repo: pspete/IdentityCommand.SCA
  commands: SCA
  prefix: SCA
  pinned:
    - Connect-SCATenant
  description: >-
    Secure Cloud Access: just-in-time access policies for cloud roles,
    discovery, eligibility, and on-demand access requests.
  image: /SCA/media/images/IdentityCommand.SCA.png
  menu:
    - label: IdentityCommand.SCA
      items:
        - name: Overview
          link: /SCA/
        - name: Getting Started
          link: /SCA/getting-started/
        - name: Commands
          link: /SCA/commands/

SIA:
  label: IdentityCommand.SIA
  repo: pspete/IdentityCommand.SIA
  commands: SIA
  prefix: SIA
  pinned:
    - Connect-SIATenant
  description: >-
    Secure Infrastructure Access: connectors, access policies, strong accounts,
    target sets, and SSH / RDP / database connections.
  image: /SIA/media/images/IdentityCommand.SIA.png
  menu:
    - label: IdentityCommand.SIA
      items:
        - name: Overview
          link: /SIA/
        - name: Getting Started
          link: /SIA/getting-started/
        - name: Commands
          link: /SIA/commands/
