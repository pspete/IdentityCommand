# Copy to .github/workflows/docs-dispatch.yml in a sibling module repo.
#
# Rebuilds the unified docs site in pspete/IdentityCommand when this repo's
# docs/ change, or when a release is published. The release trigger covers the
# release notes added by the version commit, which carries [skip ci] and so
# does not start the push trigger. Requires repository secret DOCS_DISPATCH_TOKEN:
# a fine-grained PAT with access to pspete/IdentityCommand only, permission
# Contents: read and write.
name: Docs dispatch

on:
  push:
    branches: [main]
    paths:
      - docs/**
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Send docs-updated to IdentityCommand
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          gh api repos/pspete/IdentityCommand/dispatches \
            -f event_type=docs-updated \
            -f "client_payload[repository]=${{ github.repository }}" \
            -f "client_payload[branch]=${{ github.event_name == 'release' && github.event.release.target_commitish || github.ref_name }}" \
            -f "client_payload[sha]=${{ github.sha }}"
