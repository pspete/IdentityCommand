title: IdentityCommand
description: >-
  PowerShell modules for the Palo Alto Idira (formerly CyberArk) Identity platform.
author: Pete Maan
lang: en-GB

url: https://www.pspete.dev
baseurl: /IdentityCommand
repository: pspete/IdentityCommand

theme: bulma-clean-theme
theme_color: "#1d1d1d"
favicon: /media/images/IdentityCommand-Logo.png
logo: /media/images/IdentityCommand-Logo.png
gh_sponsor: pspete
hide_share_buttons: true

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Navbar lists up to this many modules inline, otherwise the siblings move into a dropdown
navbar_inline_modules: 4

# Command index pages group by noun (default) or verb
command_index_group: noun

collections_dir: collections

# One collection per module holding its command help.
# IdentityCommand uses `commands`; each sibling module uses its short name.
collections:
  commands:
    output: true
    permalink: /commands/:title/
  SCA:
    output: true
    permalink: /SCA/commands/:title/
  SIA:
    output: true
    permalink: /SIA/commands/:title/
  AccessRequest:
    output: true
    permalink: /AccessRequest/commands/:title/
  CEM:
    output: true
    permalink: /CEM/commands/:title/
  RemoteAccess:
    output: true
    permalink: /RemoteAccess/commands/:title/
  RiskMgmt:
    output: true
    permalink: /RiskMgmt/commands/:title/
  SecretsHub:
    output: true
    permalink: /SecretsHub/commands/:title/
  SecretsManager:
    output: true
    permalink: /SecretsManager/commands/:title/
  SecureAI:
    output: true
    permalink: /SecureAI/commands/:title/
  UAP:
    output: true
    permalink: /UAP/commands/:title/
  UserPortal:
    output: true
    permalink: /UserPortal/commands/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: page
      menubar: IdentityCommand
      hero_height: is-small
  - scope:
      path: ""
      type: commands
    values:
      render_with_liquid: false
      layout: command
  - scope:
      path: SCA
    values:
      menubar: SCA
  - scope:
      path: ""
      type: SCA
    values:
      render_with_liquid: false
      layout: command
      menubar: SCA
  - scope:
      path: SIA
    values:
      menubar: SIA
  - scope:
      path: ""
      type: SIA
    values:
      render_with_liquid: false
      layout: command
      menubar: SIA
  - scope:
      path: AccessRequest
    values:
      menubar: AccessRequest
  - scope:
      path: ""
      type: AccessRequest
    values:
      render_with_liquid: false
      layout: command
      menubar: AccessRequest
  - scope:
      path: CEM
    values:
      menubar: CEM
  - scope:
      path: ""
      type: CEM
    values:
      render_with_liquid: false
      layout: command
      menubar: CEM
  - scope:
      path: RemoteAccess
    values:
      menubar: RemoteAccess
  - scope:
      path: ""
      type: RemoteAccess
    values:
      render_with_liquid: false
      layout: command
      menubar: RemoteAccess
  - scope:
      path: RiskMgmt
    values:
      menubar: RiskMgmt
  - scope:
      path: ""
      type: RiskMgmt
    values:
      render_with_liquid: false
      layout: command
      menubar: RiskMgmt
  - scope:
      path: SecretsHub
    values:
      menubar: SecretsHub
  - scope:
      path: ""
      type: SecretsHub
    values:
      render_with_liquid: false
      layout: command
      menubar: SecretsHub
  - scope:
      path: SecretsManager
    values:
      menubar: SecretsManager
  - scope:
      path: ""
      type: SecretsManager
    values:
      render_with_liquid: false
      layout: command
      menubar: SecretsManager
  - scope:
      path: SecureAI
    values:
      menubar: SecureAI
  - scope:
      path: ""
      type: SecureAI
    values:
      render_with_liquid: false
      layout: command
      menubar: SecureAI
  - scope:
      path: UAP
    values:
      menubar: UAP
  - scope:
      path: ""
      type: UAP
    values:
      render_with_liquid: false
      layout: command
      menubar: UAP
  - scope:
      path: UserPortal
    values:
      menubar: UserPortal
  - scope:
      path: ""
      type: UserPortal
    values:
      render_with_liquid: false
      layout: command
      menubar: UserPortal

exclude:
  - _tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache

sass:
  quiet_deps: true
  silence_deprecations: [import, if-function, global-builtin]
