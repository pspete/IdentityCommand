---
layout: default
---
{% assign releases = site.posts | where: "menubar", page.menubar %}
<div class="content" data-pagefind-body>
    <span hidden data-pagefind-filter="module">{{ page.menubar }}</span>
    <h1>{{ page.title }}</h1>
    {{ content }}
    <ul class="release-list">
        {% for post in releases %}
            <li>
                <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
                <span class="module-description">{{ post.subtitle }}</span>
            </li>
        {% endfor %}
    </ul>
</div>
