name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of the sibling module repos to take docs/ from
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    env:
      SIBLING_BRANCH: ${{ inputs.branch || vars.DOCS_SIBLING_BRANCH || 'main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Sync sibling module docs
        run: ruby _tools/sync_modules.rb --branch "$SIBLING_BRANCH"

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Build search index
        run: npx -y pagefind@1.5.2 --site _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
